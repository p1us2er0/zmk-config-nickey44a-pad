# Bundled binding mirror; keep identical to the standalone touch-swipe binding.
description: One horizontal swipe per complete touch, with configurable ZMK keycodes
compatible: "zmk,input-processor-touch-swipe"
include: ip_zero_param.yaml
properties:
  hwheel-code:
    type: int
    required: true
  wheel-code:
    type: int
    required: true
  touch-code:
    type: int
    required: true
  threshold:
    type: int
    default: 8
    description: Positive minimum net horizontal wheel units.
  axis-ratio:
    type: int
    default: 2
    description: Positive horizontal magnitude to total vertical travel ratio.
  left-keycode:
    type: int
    default: 0
    description: >-
      Encoded ZMK keycode tapped on a negative horizontal swipe. Leave both
      base keycodes 0 to let horizontal scrolling through unless an override
      layer is active.
  right-keycode:
    type: int
    default: 0
    description: Encoded ZMK keycode tapped on a positive horizontal swipe.
  override-layer:
    type: int
    default: -1
    description: Layer ID selecting alternate keycodes at swipe recognition; -1 disables.
  override-left-keycode:
    type: int
    default: 0
    description: Encoded keycode for a negative swipe when override-layer is active.
  override-right-keycode:
    type: int
    default: 0
    description: Encoded keycode for a positive swipe when override-layer is active.
  second-override-layers:
    type: array
    description: >-
      Layer IDs selecting the second override keycodes at swipe recognition
      when override-layer is not active. Any one active layer is enough.
  second-override-left-keycode:
    type: int
    default: 0
    description: Encoded keycode for a negative swipe when a second override layer is active.
  second-override-right-keycode:
    type: int
    default: 0
    description: Encoded keycode for a positive swipe when a second override layer is active.
  second-override-hold-keycode:
    type: int
    default: 0
    description: |
      Encoded keycode pressed by a swipe while a second override layer is
      active and held until the finger lifts, such as LEFT_GUI for an app
      switcher. While it is held, each further repeat threshold of travel in
      the same touch sends the second override keycode for its direction.
      0 keeps one swipe per touch.
  second-override-repeat-threshold:
    type: int
    default: 0
    description: |
      Horizontal travel per extra key while second-override-hold-keycode is
      held. 0 uses threshold.
