# keymap-drawer settings, also used by .github/workflows/draw.yml.
# Legends for the custom behaviors, which are otherwise drawn as raw bindings.
# Draw with `-s MAC WIN WIN_JIS NUM FUNCTION MOUSE AUTO_MOUSE`: MOUSE_SLOW, IPAD
# and ANDROID only change the trackpads and a few keys, so they would be
# drawn empty.
parse_config:
  raw_binding_map:
    "&td_comma_left_parenthesis": {t: ",", s: "2x ("}
    "&td_dot_right_parenthesis": {t: ".", s: "2x )"}
    "&td_comma_left_parenthesis_jis": {t: ",", s: "2x ("}
    "&td_dot_right_parenthesis_jis": {t: ".", s: "2x )"}
    "&single_quote_jis": {t: "'", s: "\""}
    "&lt_semi_jis LAYER_FUNCTION 0": {t: ";", s: ":", h: FUNCTION}
    "&mt_minus_jis LEFT_SHIFT 0": {t: "-", s: "_", h: LEFT SHIFT}
    "&mkp LCLK": LCLK
    "&mkp RCLK": RCLK
    "&td_bt_mac_0": {t: BT0 Mac, s: "2x kbd only"}
    "&bt_mac_kbd 5": {t: BT5 Mac, s: kbd only}
    "&bt_ipad 1": BT1 iPad
    "&bt_ipad 6": BT6 iPad
    "&bt_android 2": BT2 Android
    "&td_bt_win_3": {t: BT3 Win, s: "2x kbd only"}
    "&td_bt_win_jis_4": {t: BT4 Win JIS, s: "2x kbd only"}
    "&bootloader": Boot
    "&sys_reset": Reset
    "&soft_off_hold": {t: Power off, s: "hold 1s"}
    "&ind_bat": {t: Battery, s: LED}
    "&doc_top": {t: Doc top, s: "Mac/Win"}
    "&doc_bottom": {t: Doc end, s: "Mac/Win"}
    "&desk_left": {t: "Desk ←", s: "mobile Home"}
    "&desk_right": {t: "Desk →", s: "mobile last app"}
    "&os_comment": {t: Comment, s: "Cmd/Ctrl /"}
    "&os_grave": "`"
    "&os_equal": "="
    "&sym_at": "@"
    "&sym_caret": "^"
    "&sym_amps": "&"
    "&sym_lbrc": "{"
    "&sym_rbrc": "}"
    "&sym_bsls": "\\"
    "&sym_pipe": "|"
    "&sym_tilde": "~"
    "&sym_star": "*"
    "&sym_lbkt": "["
    "&sym_rbkt": "]"
