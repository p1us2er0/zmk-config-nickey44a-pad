#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# TPS43 (Azoteq) input forwarded to the right central
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_TPS43=y

#Bluetooth config -------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Soft off (&soft_off_hold in nickey44a.keymap), on both halves so that
# one key turns both off. The wake key pin is described with gpio-keys,
# whose own input driver must stay off (see nickey44a.dtsi).
CONFIG_ZMK_PM_SOFT_OFF=y
CONFIG_INPUT_GPIO_KEYS=n
