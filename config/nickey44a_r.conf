# Keyboard name reported to Studio
CONFIG_ZMK_KEYBOARD_NAME="Nickey44A-PAD"

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# Deep Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# TPS43 (Azoteq) pointing device
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_INPUT_TPS43=y

#Layer LED config -------------------
# Battery colors, at boot and with &ind_bat (FUNCTION + Q): green from 60 %,
# yellow from 30 %, red below that, magenta when unknown. Keep in sync with
# nickey44a_l.conf. &ind_bat shows the right half, then the left half.
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_BATTERY_SHOW_PERIPHERALS=y
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Soft off (&soft_off_hold in nickey44a.keymap), on both halves so that
# one key turns both off. No key wakes them: turn the power switch off and on.
CONFIG_ZMK_PM_SOFT_OFF=y
