name: Draw ZMK keymaps
on:
  workflow_dispatch:
  push:
    paths:
      - "config/*.keymap"
      - "config/*.dtsi"
      - "keymap_drawer.config.yaml"
jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      keymap_patterns: "config/*.keymap"
      output_folder: "keymap-drawer"
      # MOUSE_SLOW, IPAD and ANDROID only change the trackpads and a few keys,
      # and are left out of the drawing, as in docs/customizations.md.
      draw_args: "nickey44a:'-s MAC WIN WIN_JIS NUM FUNCTION_BT MOUSE AUTO_MOUSE SYSTEM'"
